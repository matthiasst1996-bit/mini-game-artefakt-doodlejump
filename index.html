<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doodle Jump - Studio Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="w-screen h-screen flex items-center justify-center bg-zinc-900">

    <!-- Main Game Frame -->
    <div id="game-container" class="relative w-full max-w-[440px] h-full max-h-[820px] sm:rounded-[32px] overflow-hidden sm:border-[6px] border-zinc-800 shadow-[0_25px_60px_rgba(0,0,0,0.7)] bg-[#f7f3e8] flex flex-col">
        
        <!-- Subtle inner paper shadow overlay -->
        <div class="paper-vignette absolute inset-0 pointer-events-none z-10"></div>

        <!-- Top Notebook Header & HUD -->
        <div id="hud" class="absolute top-0 left-0 w-full z-20 pointer-events-none">
            <!-- Top translucent paper strip with torn/ruled edge -->
            <div class="w-full h-14 bg-[#f7f3e8]/90 backdrop-blur-sm border-b-2 border-zinc-800/25 px-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="header-font text-3xl font-bold text-zinc-800 tracking-tight" id="score-display">0</span>
                    <span id="hud-highscore" class="text-xs font-bold bg-amber-200/90 border border-zinc-800 px-2 py-0.5 rounded-full text-zinc-800">🏆 0</span>
                </div>

                <!-- Active Powerup Pill -->
                <div id="powerup-hud" class="hidden bg-amber-300 border-2 border-zinc-800 px-3 py-0.5 rounded-full shadow-[2px_2px_0_#27272a] flex items-center gap-1.5">
                    <span id="powerup-icon" class="text-sm">🚀</span>
                    <span id="powerup-timer" class="header-font text-xs font-bold text-zinc-900">3.0s</span>
                </div>

                <div class="flex items-center gap-2 pointer-events-auto">
                    <!-- Tilt / Sensor Toggle for Mobile -->
                    <button id="tilt-toggle" title="Neigungssteuerung aktivieren" class="hidden sm:hidden w-9 h-9 bg-white border-2 border-zinc-800 rounded-xl shadow-[2px_2px_0_#27272a] flex items-center justify-center text-base active:translate-y-0.5">
                        📱
                    </button>
                    <!-- Sound Toggle -->
                    <button id="sound-toggle" class="w-9 h-9 bg-white border-2 border-zinc-800 rounded-xl shadow-[2px_2px_0_#27272a] flex items-center justify-center text-base active:translate-y-0.5">
                        🔊
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Canvas -->
        <canvas id="gameCanvas" class="w-full h-full"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="absolute inset-0 z-30 flex flex-col items-center justify-between p-6 pt-16 pb-8 bg-[#f7f3e8]/30 pointer-events-none">
            <div class="flex flex-col items-center text-center mt-2">
                <span class="bg-amber-300 border-2 border-zinc-800 px-3 py-0.5 rounded-full text-xs font-bold text-zinc-800 shadow-[2px_2px_0_#27272a] mb-2 -rotate-2">
                    ORIGINAL PAPER EDITION
                </span>
                <h1 class="header-font text-6xl font-bold text-emerald-500 tracking-tight drop-shadow-[3px_4px_0_#27272a] text-stroke-lg">
                    doodle<br><span class="text-amber-400">jump</span>
                </h1>
            </div>

            <!-- Interactive Play & Theme Controls -->
            <div class="flex flex-col items-center gap-3.5 w-full max-w-[260px] pointer-events-auto mt-auto mb-4">
                <button id="start-btn" class="sketch-btn w-full bg-emerald-400 hover:bg-emerald-300 text-zinc-900 header-font text-2xl font-bold py-3.5 cursor-pointer">
                    SPIELEN
                </button>

                <!-- Theme Selector -->
                <div class="flex gap-2 w-full justify-center">
                    <button data-theme="classic" class="theme-btn flex-1 py-2 bg-white border-2 border-zinc-800 rounded-xl text-sm font-bold shadow-[2px_2px_0_#27272a] ring-2 ring-emerald-500">📓 Classic</button>
                    <button data-theme="space" class="theme-btn flex-1 py-2 bg-slate-800 text-white border-2 border-zinc-900 rounded-xl text-sm font-bold shadow-[2px_2px_0_#000]">🌌 Space</button>
                    <button data-theme="jungle" class="theme-btn flex-1 py-2 bg-lime-200 border-2 border-zinc-800 rounded-xl text-sm font-bold shadow-[2px_2px_0_#27272a]">🌴 Jungle</button>
                </div>
            </div>

            <!-- Original Controls Hint Card -->
            <div class="sketch-box bg-white/95 px-4 py-2.5 text-center text-zinc-700 text-sm max-w-[310px] pointer-events-auto">
                <p class="font-bold text-zinc-900">Original-Steuerung:</p>
                <p>⬅️ ➡️ / A & D oder Neigen / Seite halten • <span class="font-bold">Tippen / Leertaste</span> zum Schießen</p>
            </div>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="gameover-screen" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center p-6 bg-[#f7f3e8]/85 backdrop-blur-sm">
            <h2 class="header-font text-5xl font-bold text-rose-500 mb-1 drop-shadow-[3px_3px_0_#27272a] -rotate-2 text-stroke-md">
                game over!
            </h2>
            <p id="gameover-reason" class="text-zinc-700 text-xl font-bold mb-6">Abgestürzt!</p>
            
            <div class="sketch-box bg-white p-6 w-full max-w-[280px] mb-8 flex flex-col gap-3">
                <div class="flex justify-between items-center border-b-2 border-dashed border-zinc-300 pb-2">
                    <span class="text-zinc-600 text-xl">deine punkte:</span>
                    <span id="final-score" class="header-font text-3xl font-bold text-zinc-900">0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-zinc-600 text-xl">rekord:</span>
                    <span id="high-score" class="header-font text-3xl font-bold text-amber-500 text-stroke-sm">0</span>
                </div>
            </div>

            <button id="restart-btn" class="sketch-btn bg-emerald-400 hover:bg-emerald-300 text-zinc-900 header-font text-2xl font-bold px-10 py-4 cursor-pointer">
                NOCHMAL
            </button>
        </div>

    </div>

    <script src="game.js"></script>
</body>
</html>
